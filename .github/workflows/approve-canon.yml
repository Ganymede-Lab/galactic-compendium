name: Approve Community Canon Submission

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  approve-submission:
    if: >
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '/approve')) ||
      (github.event_name == 'issues' &&
       github.event.label.name == 'approved-canon')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ingest approved dossier into Compendium JSON
        id: ingest
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: node scripts/approve-submission.js

      - name: Rebuild GitHub Pages & standalone bundle
        run: node build-artifact.js

      - name: Commit and push updated Compendium to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/articles.json src/data/seed.json dist/galactic_compendium.html docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Publish approved community submission #${{ github.event.issue.number }}: ${{ steps.ingest.outputs.entry_title }}"
            git push origin main
          fi

      - name: Comment live URL and close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ENTRY_ID: ${{ steps.ingest.outputs.entry_id }}
          ENTRY_TITLE: ${{ steps.ingest.outputs.entry_title }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "✅ **Approved and Published to the Galactic Compendium!**

          - **Entry**: **${ENTRY_TITLE}**
          - **Live Compendium Link**: https://ganymede-lab.github.io/galactic-compendium/#explore/${ENTRY_ID}"
          gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label "approved-canon" || true
          gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason "completed"
